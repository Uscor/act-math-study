<!DOCTYPE html>
<html>
<head>
  <title>ACT Math Practice</title>
</head>

<body>
  <h1>ACT Math Practice</h1>

  <p id="question">5 + 7</p>

  <button onclick="checkAnswer('a')">10</button>
  <button onclick="checkAnswer('b')">11</button>
  <button onclick="checkAnswer('c')">12</button>
  <button onclick="checkAnswer('d')">13</button>

  <p id="result"></p>

  <script>
    function checkAnswer(selected) {
      const correctAnswer = "c";

      if (selected === correctAnswer) {
        document.getElementById("result").innerText = "Correct";
      } else {
        document.getElementById("result").innerText = "Incorrect";
      }
    }
  </script>

</body>
</html>
