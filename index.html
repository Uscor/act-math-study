<!DOCTYPE html>
<html>
<head>
  <title>ACT Math Practice</title>
</head>

<body>
  <h1>ACT Math Practice</h1>

  <p id="question">What is 5 + 7?</p>

  <button onclick="checkAnswer('10')">10</button>
  <button onclick="checkAnswer('11')">11</button>
  <button onclick="checkAnswer('12')">12</button>
  <button onclick="checkAnswer('13')">13</button>

  <p id="result"></p>

  <script>
    function checkAnswer(selected) {
      const correctAnswer = "12";

      if (selected === correctAnswer) {
        document.getElementById("result").innerText = "Correct!";
      } else {
        document.getElementById("result").innerText = "Incorrect. Try again.";
      }
    }
  </script>

</body>
</html>
